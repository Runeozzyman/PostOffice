<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostOffice</title>
    <script>
      try {
        var root = document.documentElement;
        var theme = localStorage.getItem("postoffice.theme") || "light";
        if (!/^[a-z][a-z0-9-]*$/.test(theme)) {
          theme = "light";
        }
        root.classList.add("theme-" + theme);
        var darkThemes = { dark: true, purple: true };
        if (darkThemes[theme]) {
          root.classList.add("dark");
        }
        var fonts = {
          default: "Inter, system-ui, Avenir, Helvetica, Arial, sans-serif",
          segoe: '"Segoe UI", system-ui, sans-serif',
          calibri: 'Calibri, Carlito, "Segoe UI", sans-serif',
          georgia: "Georgia, serif",
          palatino: '"Palatino Linotype", Palatino, "Book Antiqua", serif',
          verdana: "Verdana, Geneva, sans-serif",
          trebuchet: '"Trebuchet MS", "Segoe UI", sans-serif',
        };
        var font = localStorage.getItem("postoffice.font");
        if (font && fonts[font]) {
          root.style.setProperty("--app-font", fonts[font]);
        }
        var size = Number(localStorage.getItem("postoffice.fontSize"));
        if (size >= 14 && size <= 22) {
          root.style.setProperty("--app-font-size", size + "px");
        }
        if (localStorage.getItem("postoffice.animations") === "off") {
          root.classList.add("reduce-motion");
        }
      } catch (error) {
        // Preferences will be applied after React loads.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
