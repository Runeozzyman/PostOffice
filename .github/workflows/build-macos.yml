name: Build macOS

on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: post-office
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: post-office/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write OAuth env
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET secrets are required."
            exit 1
          fi
          printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > .env

      - name: Build and package DMG
        run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            post-office/release/*.dmg
            post-office/release/*mac.zip
            post-office/release/*.zip
            post-office/release/latest-mac.yml
            post-office/release/*.blockmap
          if-no-files-found: error
